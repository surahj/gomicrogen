name: Release

on:
  # pushing a tag by hand still publishes a release
  push:
    tags:
      - "v*"

  # and the Tag and Release workflow calls this, so packaging is defined once
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and publish"
        required: true
        type: string

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve tag
        id: tag
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "Building release for $tag"

      - name: Checkout code
        # check out the tag itself, so a call from the dispatch workflow builds
        # the tagged commit rather than whatever the branch points at
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23"

      - name: Run tests
        run: make test

      - name: Build release archives
        # `make release` is the single packaging path: it cross-compiles every
        # platform and produces <binary>-<os>-<arch>-package/ archives, which is
        # the layout install.sh and install-oneline.sh look for. Packaging here
        # rather than in the workflow keeps CI and local builds identical.
        run: make release VERSION=${{ steps.tag.outputs.tag }}

      - name: Verify archive layout
        # the installers abort if the package directory is missing, so fail the
        # release here rather than shipping archives nobody can install
        run: |
          set -e

          for archive in release/*.tar.gz; do
            name=$(basename "$archive" .tar.gz)

            if ! tar -tzf "$archive" | grep -q "^${name}-package/"; then
              echo "::error::$archive is missing the ${name}-package/ directory the installers expect"
              exit 1
            fi
            if ! tar -tzf "$archive" | grep -q "^${name}-package/templates/base/"; then
              echo "::error::$archive does not contain templates/base"
              exit 1
            fi
          done

          for archive in release/*.zip; do
            name=$(basename "$archive" .zip)

            if ! unzip -l "$archive" | grep -q "${name}-package/"; then
              echo "::error::$archive is missing the ${name}-package/ directory"
              exit 1
            fi
          done

          echo "All archives carry the expected layout"
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Installation

            ### Linux/macOS
            ```bash
            curl -fsSL https://raw.githubusercontent.com/surahj/gomicrogen/main/install-oneline.sh | bash
            ```

            ### Windows (PowerShell)
            ```powershell
            Invoke-Expression (Invoke-WebRequest -Uri "https://raw.githubusercontent.com/surahj/gomicrogen/main/install.ps1" -UseBasicParsing).Content
            ```

            ### Manual
            Download the archive for your platform below and extract it. Each archive
            contains the binary and a `templates/` directory — gomicrogen reads its
            templates from disk, so both must be installed together.

            ## Quick Start

            ```bash
            gomicrogen new my-service --module github.com/your-org/my-service
            gomicrogen new pawapay-service --module github.com/choplife-group/pawapay-service --type payment
            ```

            ## Supported Platforms

            - Linux (AMD64, ARM64)
            - macOS (AMD64, ARM64)
            - Windows (AMD64, ARM64)
          files: |
            release/*.tar.gz
            release/*.zip
          draft: false
          # a tag with a suffix (v1.2.3-rc1, -beta) publishes as a prerelease, so
          # it never becomes "latest" — which is what the installers resolve
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
